<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReaderLog</title>
    <link rel="stylesheet" href="/styles/liststyles.css">
</head>
<body>
<nav>
    <form th:method="GET" th:action="@{/readers/{userId}
            (userId = ${user.getId()})}">
        <button>To Main Page</button>
    </form>
    <form action="/home">
        <button>Home</button>
    </form>
    <a href="/logout">LogOut</a>
</nav>
<h2>
    List of Reading or Read Books
</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Book</th>
        <th>Authors</th>
        <th>DateOut</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="readerlog: ${readerlogs}">
        <td th:text="${readerlog.getId()}">ID</td>
        <td th:text="${readerlog.getBook().getTitle()}">name</td>
        <td>
            <ul>
                <li th:each="author:${readerlog.getBook().getAuthors()}" th:text="${author.getName()} + ' ' +${author.getSurname()}">Author Name</li>
            </ul>
        </td>
        <td th:text="${readerlog.getDateOut()}"> dateout </td>
        <td>
            <form th:method="POST" class="btn btn-success" th:action="@{/readers/{userId}/return/{readerLogId}
            (userId = ${user.getId()}, readerLogId = ${readerlog.getId()})}">
                <button>Return</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
