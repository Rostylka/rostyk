<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <title>new User</title>
    <link rel="stylesheet" href="/styles/newstyles.css">
</head>
<h2>
    Create User
</h2>
<body>
<form th:method="POST" th:action="@{/users/create}" th:object=${user}>
    <table>
        <tr>
            <td><label for="name"> Name: </label></td>
            <td><input type="text" th:field="*{name}" id="name"/></td>
        </tr>
        <tr>
            <td><label for="surname"> Surname: </label></td>
            <td><input type="text" th:field="*{surname}" id="surname"/>
            </td>
        </tr>
        <tr>
            <td><label for="email"> e-mail: </label></td>
            <td><input type="email" th:field="*{email}" id="email"/></td>
        </tr>
        <tr>
            <td><label for="login"> login: </label></td>
            <td><input type="text" th:field="*{login}" id="login"/></td>
        </tr>
        <tr>
            <td><label for="password"> password: </label></td>
            <td><input type="password" th:field="*{password}" id="password"/></td>
        </tr>
        <tr>
            <td><label for="birthday"> birthday: </label></td>
            <td><input type="date" th:field="*{birthday}" id="birthday"/></td>
        </tr>
            <td><label for="role"> role: </label></td>
            <td>
                <select th:field="*{role}" id="role">
                    <option th:each="role: ${roles}"
                            th:value ="${role.getId()}"
                            th:text ="${role.getRoleName()}">                                >
                    </option>
                </select>
            </td>
        <tr>
            <td><input type="submit" value="Create"></td>
            <td><input type="reset" value="Clear"></td>
        </tr>
    </table>
</form>
<form action="/users">
    <button>All Users</button>
</form>
</body>
</html>
