<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <title>Update User</title>
    <link rel="stylesheet" href="/styles/newstyles.css">
</head>
<h2>
    Update User
</h2>
<body>
<form th:method="POST" th:action="@{/users/update/{id} (id = ${user.getId()})}" th:object=${user}>
    <table>
        <tr>
            <td><label for="name"> Name: </label></td>
            <td><input type="text" th:field="*{name}" th:value="${user.getName()}" id="name"/></td>
        </tr>
        <tr>
            <td><label for="surname"> Surname: </label></td>
            <td><input type="text" th:field="*{surname}" th:value="${user.getSurname()}"id="surname"/>
            </td>
        </tr>
        <tr>
            <td><label for="email"> e-mail: </label></td>
            <td><input type="email" th:field="*{email}" th:value="${user.getEmail()}" id="email"/></td>
        </tr>
        <tr>
            <td><label for="login"> login: </label></td>
            <td><input type="text" th:field="*{login}" th:value="${user.getLogin()}" id="login"/></td>
        </tr>
        <tr>
            <td><label for="password"> password: </label></td>
            <td><input type="password" th:field="*{password}" th:value="${user.getPassword()}" id="password"/></td>
        </tr>
        <tr>
            <td><label for="birthday"> birthday: </label></td>
            <td><input type="date" th:field="*{birthday}" th:value="${user.getBirthday()}" id="birthday"/></td>
        </tr>
        <td><label for="role"> role: </label></td>
        <td>
            <select th:field="*{role}" id="role">
                <option th:each="role: ${roles}"
                        th:value ="${role.getId()}"
                        th:text ="${role.getRoleName()}">                                >
                </option>
            </select>
        </td>
        <tr>
            <td><input type="submit" value="Update"></td>
            <td><input type="reset" value="Clear"></td>
        </tr>
    </table>
</form>
<form action="/users">
    <button>All Users</button>
</form>
</body>
</html>
