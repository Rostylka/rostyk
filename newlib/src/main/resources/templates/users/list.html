<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link rel="stylesheet" href="/styles/liststyles.css">
</head>
<h2>
    List of Users
</h2>
<body>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>e-mail</th>
        <th>login</th>
        <th>password</th>
        <th>birthday</th>
        <th>role</th>
        <th>
            <form class="btn btn-success" action="/home">
                <button>home</button>
            </form>
        </th>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.getId()}">ID</td>
        <td th:text="${user.getName()}">name</td>
        <td th:text="${user.getSurname()}">surname</td>
        <td th:text="${user.getEmail()}">email</td>
        <td th:text="${user.getLogin()}">login</td>
        <td th:text="${user.getPassword()}">password</td>
        <td th:text="${user.getBirthday()}">birthday</td>
        <td th:text="${user.getRole()}">role</td>
        <td>
            <form th:method="GET" class="btn btn-success" th:action="@{/users/{id} (id = ${user.getId()})}">
                <button>Goto</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
