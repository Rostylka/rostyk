<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authors</title>
    <link rel="stylesheet" href="/styles/liststyles.css">
</head>
<nav>
    <form th:action="${link}">
        <button>Main Page</button>
    </form>
    <form action="/home">
        <button>home</button>
    </form>
    <a href="/logout">LogOut</a>
</nav>
<h2>
    List of Authors
</h2>
<body>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>View Info</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="author : ${authors}">
        <td th:text="${author.getId()}">ID</td>
        <td th:text="${author.getName()}">name</td>
        <td th:text="${author.getSurname()}">surname</td>
        <td>
            <form th:method="GET" class="btn btn-success" th:action="@{/authors/{id} (id = ${author.getId()})}">
                <button>Goto</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
