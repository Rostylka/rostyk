<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <title>Roles</title>
</head>
<h2>
    List of Roles
</h2>
<body>
<table>
    <tr>
        <th>ID</th>
        <th>role</th>
        <td>
            <form class="btn btn-success" action="/home">
                <button>home</button>
            </form>
        </td>
    </tr>
    <tr th:each="role: ${roles}">
        <td th:text="${role.getId()}">ID</td>
        <td th:text="${role.getRoleName()}">name</td>
        <td>
            <form th:method="GET" class="btn btn-success" th:action="@{/roles/{id} (id = ${role.getId()})}">
                <button>Goto</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
