<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <title>Update Role</title>
    <link rel="stylesheet" href="/styles/newstyles.css">
</head>
<h2>
    Update Role
</h2>
<body>
<form th:method="POST" th:action="@{/roles/update/{id} (id = ${role.getId()})}" th:object=${role}>
    <table>
        <tr>
            <td><label for="name"> Name: </label></td>
            <td><input type="text" th:field="*{roleName}" th:value="${role.getRoleName()}" id="name"/></td>
        </tr>
        <tr>
            <td><input type="submit" value="Update"></td>
            <td><input type="reset" value="Clear"></td>
        </tr>
    </table>
</form>
<form action="/roles">
    <button>All Roles</button>
</form>
</body>
</html>
