<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://thymeleaf.org">
    <title>new Role</title>
</head>
<h2>
    Create Role
</h2>
<body>
<form th:method="POST" th:action="@{/roles/create}" th:object=${role}>
    <table>
        <tr>
            <td><label for="type"> Name: </label></td>
            <td><input type="text" th:field="*{roleName}" id="type"/></td>
        </tr>
        <tr>
            <td><input type="submit" value="Create"></td>
            <td><input type="reset" value="Clear"></td>
        </tr>
    </table>
</form>
<form action="/roles">
    <button>All Roles</button>
</form>
</body>
</html>
