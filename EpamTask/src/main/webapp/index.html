<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Catalogue</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Football Equipment Catalogue</h1>
    <div class="filter">
        <label for="category">Filter by Category: </label>
        <select id="category" onchange="filterProducts()">
            <option value="all">All</option>
            <option value="jerseys">Jerseys</option>
            <option value="boots">Football Boots</option>
            <option value="accessories">Accessories</option>
        </select>
    </div>
</header>

<section class="product-container">
    <div class="product" data-category="jerseys">
        <img src="https://thumblr.uniid.it/product/375637/59b0342c2127.jpg?width=3840&format=webp&q=75" alt="Football Jersey">
        <h3>FC Barcelona Jersey</h3>
        <p>Price: $79</p>
    </div>
    <div class="product" data-category="boots">
        <img src="https://goleador.in.ua/image/cache/data/products/0184/adghh-700x538.jpg" alt="Football Boots">
        <h3>Nike Mercurial Superfly</h3>
        <p>Price: $150</p>
    </div>
    <div class="product" data-category="accessories">
        <img src="https://m.media-amazon.com/images/I/716sNg8iClL._AC_UF894,1000_QL80_.jpg" alt="Football Ball">
        <h3>Adidas Tango Football</h3>
        <p>Price: $35</p>
    </div>
    <div class="product" data-category="jerseys">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTC_ruWADJwZ_1EXGAdmvBOqT2_Mf8gl1z6Yg&s" alt="Football Jersey">
        <h3>Manchester United Jersey</h3>
        <p>Price: $89</p>
    </div>
    <div class="product" data-category="boots">
        <img src="https://goleador.in.ua/image/cache/data/products/0368/agngh-700x538.jpeg" alt="Football Boots">
        <h3>Adidas Predator</h3>
        <p>Price: $130</p>
    </div>
</section>

<footer>
    <p>&copy; 2025 Football Store</p>
</footer>

<script src="script.js"></script>
</body>
</html>
